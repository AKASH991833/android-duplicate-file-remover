name: Emulator UI tests
on:
  push:
  workflow_dispatch:
jobs:
  emu-test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 29
            os: ubuntu-latest
            arch: x86_64
            emu-opts: -no-snapshot-save -no-window -gpu swiftshader_indirect
          - api-level: 34
            os: macos-14
            arch: arm64-v8a
            emu-opts: -no-snapshot-save -no-window -gpu host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Seed test files
        run: |
          set -e
          command -v convert >/dev/null || { [ "$(uname)" = Linux ] && sudo apt-get update && sudo apt-get install -y imagemagick || brew install imagemagick; }
          cd "$GITHUB_WORKSPACE"
          mkdir -p seeds/DupeTest/sub seeds/DupeTest2
          convert -size 800x600 plasma:fractal -quality 85 seeds/DupeTest/photoA.jpg
          cp seeds/DupeTest/photoA.jpg seeds/DupeTest/photoA_copy.jpg
          cp seeds/DupeTest/photoA.jpg seeds/DupeTest/sub/photoA_third.jpg
          convert -size 2400x1800 plasma:fractal -quality 88 seeds/DupeTest/big1.jpg
          cp seeds/DupeTest/big1.jpg seeds/DupeTest/big2.jpg
          convert -size 700x500 plasma:fractal -quality 85 seeds/DupeTest/sim_base.jpg
          convert seeds/DupeTest/sim_base.jpg -modulate 101,100,100 -quality 85 seeds/DupeTest/sim_tweak.jpg
          convert -size 640x480 plasma:fractal -quality 85 seeds/DupeTest/unique_photo.jpg
          touch seeds/DupeTest/empty1.jpg seeds/DupeTest/empty2.jpg
          yes 'lorem ipsum dolor sit amet duplicate content line' | head -120 > seeds/DupeTest/doc1.txt
          cp seeds/DupeTest/doc1.txt seeds/DupeTest/doc1_copy.txt
          echo 'a completely different unique document body' > seeds/DupeTest/doc2.txt
          printf '%%PDF-1.1\n1 0 obj<</Type/Catalog>>endobj\ntrailer<</Root 1 0 R>>\n%%%%EOF\n' > seeds/DupeTest/fake1.pdf
          cp seeds/DupeTest/fake1.pdf seeds/DupeTest/fake2.pdf
          dd if=/dev/urandom of=seeds/DupeTest/vid1.mp4 bs=1M count=1
          cp seeds/DupeTest/vid1.mp4 seeds/DupeTest/vid2.mp4
          echo 'saf duplicate text saf duplicate text saf duplicate text' > seeds/DupeTest2/saf1.txt
          cp seeds/DupeTest2/saf1.txt seeds/DupeTest2/saf2.txt
          ls -laR seeds
      - name: Run emulator UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: default
          arch: ${{ matrix.arch }}
          profile: Nexus 6
          disable-animations: true
          emulator-options: ${{ matrix.emu-opts }}
          script: |
            adb wait-for-device
            for i in $(seq 1 60); do [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ] && break; sleep 2; done
            for i in $(seq 1 90); do adb shell 'touch /sdcard/.probe && rm /sdcard/.probe' && break; sleep 2; done
            adb shell input keyevent 82
            mkdir -p "$GITHUB_WORKSPACE/out"
            adb push "$GITHUB_WORKSPACE/seeds/DupeTest" /sdcard/DupeTest
            adb push "$GITHUB_WORKSPACE/seeds/DupeTest2/saf1.txt" /sdcard/Download/saf1.txt
            adb push "$GITHUB_WORKSPACE/seeds/DupeTest2/saf2.txt" /sdcard/Download/saf2.txt
            adb shell ls -R /sdcard/DupeTest
            python3 ci/drive.py ${{ matrix.api-level }}
      - name: Publish screenshots branch
        if: always()
        run: |
          set -e
          rm -rf /tmp/pub && mkdir -p /tmp/pub && cd /tmp/pub
          git init -q .
          git config user.email actions@github.com
          git config user.name 'github-actions'
          git checkout -q --orphan latest
          cp -r "$GITHUB_WORKSPACE/out"/. . || true
          cat > RUN.md <<EOF
          # Emulator test run ${{ github.run_id }} (API ${{ matrix.api-level }})
          Commit: ${{ github.sha }}
          Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          git add -A
          git commit -qm "emulator shots api${{ matrix.api-level }} run ${{ github.run_id }}" || true
          git push -qf https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:refs/heads/emulator-shots-api${{ matrix.api-level }}
      - name: Upload screenshots artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-test-api${{ matrix.api-level }}
          path: out/
          if-no-files-found: warn
